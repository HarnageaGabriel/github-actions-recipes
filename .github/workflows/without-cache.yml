name: Install deps (without cache)

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies (timed)
        run: |
          start=$(date +%s)
          npm install
          end=$(date +%s)
          echo "::notice title=Install time::$((end-start))s"
