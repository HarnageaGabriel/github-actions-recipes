name: Install deps (with cache)

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies (timed)
        run: |
          start=$(date +%s)
          npm install
          end=$(date +%s)
          echo "::notice title=Install time::$((end-start))s"
